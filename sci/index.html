<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prontidão SCI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho lateral azul-aeroporto (desktop) / barra inferior (celular); faixa de serviço no topo; conteúdo em painéis e listas tipo "strip" de operações */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#0F1E2E; --ink-2:#51627A; --ink-3:#7D8DA1; --line:#D5DDE7;
  --brand:#0B4A8B; --brand-soft:#E3ECF7; --rail:#0B3F78; --rail-ink:#E8F0FA; --rail-2:#9FB8D6; --rail-hi:#155799;
  --green:#5F8F12; --green-soft:#EDF5DF; --fire:#C8321E; --fire-soft:#FBE7E3;
  --ok:#2C7A47; --ok-soft:#E3F2E8; --warn:#A85F00; --warn-soft:#FBF0DC; --crit:#C8321E; --crit-soft:#FBE7E3; --mute-soft:#EBEFF4;
  --shadow:0 1px 2px rgba(15,30,46,.06),0 8px 24px rgba(15,30,46,.06);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --logo-c:block; --logo-w:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A121B; --surface:#111B26; --surface-2:#16212E; --ink:#E4EBF3; --ink-2:#97A8BC; --ink-3:#6E8097; --line:#243343;
  --brand:#6AA6E8; --brand-soft:#15283D; --rail:#08203B; --rail-ink:#E4EEF9; --rail-2:#88A3C4; --rail-hi:#12345A;
  --green:#97C944; --green-soft:#1B2A12; --fire:#F0604A; --fire-soft:#3A1A15;
  --ok:#55B57E; --ok-soft:#14291D; --warn:#E3A640; --warn-soft:#33260F; --crit:#F0604A; --crit-soft:#3A1A15; --mute-soft:#1B2633;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-c:none; --logo-w:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121B; --surface:#111B26; --surface-2:#16212E; --ink:#E4EBF3; --ink-2:#97A8BC; --ink-3:#6E8097; --line:#243343;
  --brand:#6AA6E8; --brand-soft:#15283D; --rail:#08203B; --rail-ink:#E4EEF9; --rail-2:#88A3C4; --rail-hi:#12345A;
  --green:#97C944; --green-soft:#1B2A12; --fire:#F0604A; --fire-soft:#3A1A15;
  --ok:#55B57E; --ok-soft:#14291D; --warn:#E3A640; --warn-soft:#33260F; --crit:#F0604A; --crit-soft:#3A1A15; --mute-soft:#1B2633;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --logo-c:none; --logo-w:block; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
svg{width:20px;height:20px;flex:none}
.who svg{width:16px;height:16px;opacity:.8}
.photo svg{width:24px;height:24px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:34px} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--ink-2)}
.muted{color:var(--ink-2)} .small{font-size:13px}
.logo-c{display:var(--logo-c)} .logo-w{display:var(--logo-w)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:24px}
.lockup{display:flex;align-items:center;gap:16px}
.lockup img.crest{width:76px;height:76px;flex:none}
.lockup .aero{height:44px;width:auto}
.login h1{font-size:52px;line-height:.95}
.login h1 span{color:var(--fire)}
.roles{display:grid;gap:8px}
.role{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--brand);transform:translateX(2px)}
.role .badge{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--brand-soft);color:var(--brand)}
.role.ger .badge{background:var(--green-soft);color:var(--green)}
.role b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.01em}
.role .arrow{color:var(--ink-3)}
.demo-note{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:14px}

/* ---------- shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--rail);color:var(--rail-ink)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .crest-sm{width:34px;height:34px;flex:none}
.duty{display:flex;flex-direction:column;min-width:0;flex:1}
.duty .t1{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duty .t1 em{font-style:normal;color:#B9DD7A}
.duty .t2{font-family:var(--f-mono);font-size:12px;color:var(--rail-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;background:var(--rail-hi);border:0;border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;color:var(--rail-ink);flex:none}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--rail-ink);color:var(--rail);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.who span{font-size:13px;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stripe{height:4px;background:repeating-linear-gradient(-45deg,var(--fire) 0 10px,transparent 10px 20px);opacity:.9}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rail-2);display:inline-block}
.dot.live{background:#7CD992;box-shadow:0 0 0 3px rgba(124,217,146,.18)}
.dot.off{background:#F2B65C}

.content{width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead .lead{display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:-4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--fire)}
.tab .n{font-family:var(--f-mono);font-size:12px;background:var(--mute-soft);color:var(--ink-2);border-radius:999px;padding:1px 7px;margin-left:6px;font-weight:500}
.tab .n.hot{background:var(--crit-soft);color:var(--crit)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--brand)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--brand);border-radius:0 0 3px 3px}
.pip{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px}

@media (min-width:900px){
  .app{grid-template-columns:252px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-ink);padding:22px 14px}
  .side .brand{display:flex;flex-direction:column;gap:14px;padding:0 6px}
  .side .brand .row{display:flex;align-items:center;gap:10px}
  .side .brand img.crest{width:48px;height:48px}
  .side .brand .name{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:.9;letter-spacing:.02em}
  .side .brand .name small{display:block;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--rail-2);text-transform:uppercase;margin-top:4px}
  .side .brand img.aero{width:150px;height:auto;opacity:.95}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--rail-2);padding:10px 12px;border-radius:8px;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em;text-align:left;position:relative}
  .nav button svg{width:20px;height:20px;flex:none}
  .nav button:hover{color:var(--rail-ink);background:rgba(255,255,255,.05)}
  .nav button.on{background:var(--rail-hi);color:var(--rail-ink)}
  .nav .pip{position:static;margin-left:auto}
  .side .foot{margin-top:auto;font-size:12px;color:var(--rail-2);padding:0 6px;line-height:1.5}
  .main{padding-bottom:0}
  .tabbar{display:none}
  .top .crest-sm{display:none}
  .content{padding-block:28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  h1{font-size:40px}
}

/* ---------- building blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px 16px}
.grid2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:1000px){.grid2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.kpi.warn::after{background:var(--warn)} .kpi.crit::after{background:var(--crit)} .kpi.ok::after{background:var(--ok)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:500}

.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:760px){.qa{grid-template-columns:repeat(6,minmax(0,1fr))}}
.qa button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.15;text-align:center}
.qa button svg{width:24px;height:24px;color:var(--brand)}
.qa button.hot svg{color:var(--fire)}
.qa button:hover{border-color:var(--brand)}

.vtrs{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.vtrs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vtr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vtr .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vtr .nm{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.vtr .role-l{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.gauge .lab b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--mute-soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.bar i.low{background:var(--warn)} .bar i.vlow{background:var(--crit)}
.vtr .restr{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px}
.vtr .meta{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.info{background:var(--brand-soft);color:var(--brand)} .chip.grn{background:var(--green-soft);color:var(--green)}
.chip.plain::before{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06121F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06121F}}
.btn.fire{background:var(--fire);border-color:var(--fire);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.okb{color:var(--ok);border-color:var(--ok)} .btn.critb{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.55;cursor:default}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.click{cursor:pointer} .row.click:hover{background:var(--surface-2)}
.row .ttl{font-weight:600}
.row .sub{font-size:13px;color:var(--ink-2)}
.row .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.ico svg{width:18px;height:18px}
.ico.fire{background:var(--fire-soft);color:var(--fire)} .ico.grn{background:var(--green-soft);color:var(--green)} .ico.warn{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* strip (flight-strip style) for BONAs and solicitações */
.strip{display:grid;grid-template-columns:96px minmax(0,1fr) auto;border-top:1px solid var(--line);cursor:pointer}
.strip:first-child{border-top:0}
.strip:hover{background:var(--surface-2)}
.strip .cell-a{padding:12px 12px 12px 16px;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.strip .cell-a .num{font-family:var(--f-mono);font-size:13px;font-weight:500}
.strip .cell-a .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.strip .cell-b{padding:12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip .cell-c{padding:12px 16px 12px 0;display:flex;align-items:center}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.fbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.timeline .row{grid-template-columns:52px minmax(0,1fr)}
.timeline .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:2px;line-height:1.3}
.timeline .k{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.k.c-avaria{color:var(--crit)} .k.c-sol{color:var(--warn)} .k.c-ocor{color:var(--fire)} .k.c-check,.k.c-abast,.k.c-checkeq{color:var(--brand)} .k.c-dea{color:var(--fire)} .k.c-treino,.k.c-taf{color:var(--green)} .k.c-ferias{color:var(--brand)} .k.c-obs,.k.c-passagem{color:var(--green)} .k.c-ext{color:var(--ink-2)}

.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:4px 10px;align-items:center;font-size:13px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--mute-soft);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--fire);border-radius:4px}
.hbar .c{font-family:var(--f-mono);text-align:right}

.ai{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 70%);padding:16px;display:flex;flex-direction:column;gap:10px}
.ai-out{white-space:pre-wrap;font-size:14px;line-height:1.55}
.ai .hd{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.spark{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand)}
.spark svg{width:18px;height:18px}

.plan-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.plan-role{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.plan-role .h{font-family:var(--f-display);font-weight:700;font-size:17px}

/* forms */

/* tabelas que viram cartões no celular */
.rt .rt-m, .rt .rt-only{display:none}
@media (max-width:620px){
  .tbl-wrap:has(> table.rt){overflow:visible}
  table.rt, table.rt tbody{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{display:block;padding:0;border:0;min-width:0;text-align:left!important;white-space:normal}
  table.rt td::before{content:attr(data-label);display:block;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
  table.rt td[data-label=""]::before{display:none}

  table.rt .rt-m{display:inline}
  table.rt td.rt-only{display:block}
  table.rt th.rt-only{display:none}
  table.rt.rt-compact tr{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px;align-items:center}
  table.rt.rt-compact td.num{text-align:right!important}
  table.rt tr.click:hover td{background:none}

}

/* ---------- liquid glass (leve) ---------- */
:root{
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.7); --glass-edge:rgba(15,30,46,.08);

  --blob-a:rgba(11,74,139,.14); --blob-b:rgba(135,190,40,.10); --blob-c:rgba(200,50,30,.06);

}

:root[data-theme="dark"]{

body{background:

  radial-gradient(42vw 42vw at 4% 106%,var(--blob-b),transparent 70%),
  radial-gradient(34vw 34vw at 50% 55%,var(--blob-c),transparent 72%),
  var(--bg);background-attachment:fixed}
.panel,.kpi,.vtr,.qa button,.role,.ai,.doc,.mais-b,.photo,.checks,.fbtn:not(.on),.btn:not(.pri):not(.fire):not(.okb):not(.critb),.seg button:not(.on),.stockrow .qbtn,.qbtn{
  background:var(--glass);border-color:var(--glass-line);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1px var(--glass-edge),var(--glass-sh);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.panel,.kpi,.vtr,.qa button,.role,.ai,.mais-b,.checks{border-radius:14px}
.fbtn:not(.on),.btn:not(.pri):not(.fire),.seg button:not(.on),.qbtn{box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1px var(--glass-edge)}
.btn.pri,.btn.fire{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -8px rgba(11,63,120,.55)}
.panel-h,.list .row,.strip,table td,table th{background:transparent}
.ck{background:transparent}
.guia{background:color-mix(in srgb,var(--brand-soft) 70%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:14px}
.meu{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 34px -18px rgba(8,32,59,.8);background:linear-gradient(135deg,var(--rail),color-mix(in srgb,var(--rail) 78%,var(--brand)))}
.top{background:var(--glass-rail);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%)}
body::before{background:var(--glass-rail);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabbar{background:var(--glass-bar);border-top-color:var(--glass-line);box-shadow:0 -8px 24px -18px rgba(11,63,120,.35);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
@media (min-width:900px){.side{background:var(--glass-rail);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);box-shadow:inset -1px 0 0 rgba(255,255,255,.08)}}
.nav button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.scrim{background:rgba(6,14,24,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1px var(--glass-line),0 30px 60px -20px rgba(6,14,24,.45);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.sheet-h{border-bottom-color:var(--glass-line)}

.f input,.f select,.f textarea{background:var(--glass-2)}
.kpi::after{border-radius:14px 0 0 14px}

.role.rede .badge{background:var(--rail);color:var(--rail-ink)}
.kpi .v small{font-size:20px;color:var(--ink-3);font-weight:700}
.rb-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.rb-board{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rb-t{position:relative;display:flex;flex-direction:column;gap:1px;align-items:flex-start;text-align:left;border:1px solid var(--glass-line);background:var(--glass);box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1px var(--glass-edge);border-radius:10px;padding:9px 10px 9px 14px;cursor:pointer;min-width:0;overflow:hidden;color:var(--ink)}
.rb-t::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.rb-t.warn{background:var(--warn-soft)} .rb-t.warn::before{background:var(--warn)}
.rb-t.crit{background:var(--crit-soft)} .rb-t.crit::before{background:var(--crit)}
.rb-t:hover{border-color:var(--brand)}
.rb-t b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.1}
.rb-t span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rb-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.rb-legend span{display:inline-flex;align-items:center;gap:6px}
.rb-legend i{width:10px;height:10px;border-radius:3px;background:var(--ok)}
.rb-legend i.warn{background:var(--warn)} .rb-legend i.crit{background:var(--crit)}
.rb-reg{display:flex;flex-direction:column;gap:10px}
#rb-bases{scroll-margin-top:84px}
.vtr.rb-card{cursor:pointer;transition:transform .15s,border-color .15s}
.vtr.rb-card:hover{transform:translateY(-1px);border-color:var(--brand)}
.vtr.rb-card.crit{border-color:color-mix(in srgb,var(--crit) 55%,transparent)}
@media (prefers-reduced-motion:reduce){.vtr.rb-card{transition:none}.vtr.rb-card:hover{transform:none}}
.vtr .restr.crit{color:var(--crit);background:var(--crit-soft)}
.rb-card .nm{letter-spacing:.04em}
.rb-vtrs{display:flex;flex-wrap:wrap;gap:6px}
.rb-v{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--mute-soft);color:var(--ink);white-space:nowrap}
.rb-v i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.rb-v.rest i{background:var(--warn)} .rb-v.inop i{background:var(--crit)}
.rb-v.inop{background:var(--crit-soft);color:var(--crit)}
.rb-v.res{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.rb-v small{font-weight:500;color:var(--ink-3);font-size:11px}
.rb-dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.rb-dl.d5{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.rb-dl div{display:flex;flex-direction:column;gap:1px;min-width:0}
.rb-dl dt{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.rb-dl dd{margin:0;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rb-dl dd small{font-size:11px;color:var(--ink-3)}
.rb-dl dd.bad{color:var(--crit)} .rb-dl dd.warn{color:var(--warn)}
.rb-live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.rb-live .dot.live{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);background:var(--ok)}
.vtr .meta .rb-open{margin-left:auto;color:var(--brand);font-weight:700}
.rb-tbl{min-width:600px}
.rb-tbl th.r,.rb-tbl td.r{text-align:right}
.rb-tbl tr.click{cursor:pointer} .rb-tbl tr.click:hover td{background:var(--surface-2)}
.rb-tbl td.bad{color:var(--crit)} .rb-tbl td.warn{color:var(--warn)}
.rb-tbl td .cid{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rb-tr{display:grid;grid-template-columns:minmax(90px,1fr) 44px;gap:10px;align-items:center}
.rb-tr .track{position:relative;height:8px;background:var(--mute-soft);border-radius:4px}
.rb-tr .track i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:4px}
.rb-tr .track i.over{background:var(--crit)}
.rb-tr .track em{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--fire)}
.rb-tr .mono{font-size:13px;text-align:right}
.rb-sh-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rb-sh .panel .row:first-child{border-top:0}
.rb-back{align-self:flex-start;margin:-6px 0 -10px -8px}

const ROLES = [

const can = a => (LVL[S.role]||0) >= (NEED[a]||99);
const TEAM_ROLES = ['ce','mot','ba'];
function membros(team){
  const r = rec('equipe-'+team);
  if (r && Array.isArray(r.membros)) return r.membros;
  const R = ROSTER[team];
  return [{nome:R.ce, cargo:'ce'}, ...R.mot.map(n=>({nome:n, cargo:'mot'})), ...R.ba.map(n=>({nome:n, cargo:'ba'}))];
}
function rosterOf(team){
  const ms = membros(team), by = c => ms.filter(m=>m.cargo===c).map(m=>m.nome);
  return {ce: by('ce')[0] || '—', ces: by('ce'), mot: by('mot'), ba: by('ba')};
}
function saveEquipe(t, ms){ save({id:'equipe-'+t, kind:'equipe', equipe:t, membros:ms}); }
function vincular(team, nome, cargo){
  TEAMS.forEach(t => {
    const ms = membros(t), has = ms.find(m=>m.nome===nome);
    if (t === team) { if (!has || has.cargo !== cargo) saveEquipe(t, ms.filter(m=>m.nome!==nome).concat([{nome, cargo, desde:Date.now()}])); }

seed().forEach(r => S.ex.set(r.id, r));

function all(kind){ const m = new Map(); for (const [id,r] of S.ex) if (r.kind === kind) m.set(id, r); for (const [id,r] of S.db) if (r.kind === kind) m.set(id, r); return [...m.values()]; }
const byTs = (a,b) => (b.ts||0) - (a.ts||0);
const me = () => S.prof ? {name:S.prof.name, team:S.prof.team} : {name:'', team:null};

async function save(r){
  r = clone(r); r.updatedAt = Date.now(); delete r.demo;
  S.db.set(r.id, r); render();
  if (!S.coll) return;
  try { await S.coll.doc(r.id).set(r); }
  catch(e){
    if (e && e.code === 'unavailable') { try { await new Promise(res=>setTimeout(res, 800+Math.random()*600)); await S.coll.doc(r.id).set(r); return; } catch(_){} }
    toast(e && e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. O registro ficou só neste aparelho.' : 'Sem permissão para salvar na base compartilhada. O registro ficou só neste aparelho.');
  }
}
function nextNum(kind, field, prefix){ let mx = 0; all(kind).forEach(r => { const mm = String(r[field]||'').match(/\d+/); const n = mm ? parseInt(mm[0],10) : 0; if (n > mx) mx = n; }); return prefix ? prefix + pad(mx+1).padStart(4,'0') : mx+1; }

const SAMPLE = (window.claude && window.claude.use) ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);
(async () => {
  let db = null;
  try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db) { S.sync = 'off'; renderTop(); return; }
  const coll = db.collection('registros'); S.coll = coll;
  const timer = setTimeout(() => { if (S.sync === 'loading') { S.sync = 'slow'; renderTop(); } }, 10000);
  coll.onSnapshot(snap => {
    const m = new Map(); snap.docs.forEach(d => { const v = d.data(); if (v && v.kind) m.set(d.id, v); });
    S.db = m;
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.sync = 'live'; }
    render();
  }, err => { clearTimeout(timer); S.sync = 'off'; S.coll = null; renderTop(); });
})();

function afterRender(){

}

  if (p.team) { const rc = reciclagem(p.name); if (precisaRecicl(rc)) P.push({ic:'report', t: rc.status==='sem' ? 'Sua reciclagem não está cadastrada' : rc.status==='vencida' ? 'Sua reciclagem está vencida' : `Sua reciclagem vence em ${rc.dias} dias`, s: rc.t ? `Validade ${fDY(rc.t)} · combine a data com o gestor` : 'Informe a validade em Meu perfil → Editar dados', act:'perfil', n:p.name, crit: rc.cls === 'crit'}); }
  if (lv >= 3) { const grupo = lv >= 4 ? TEAMS.flatMap(t => membros(t)) : (p.team ? membros(p.team) : []); const rr = grupo.filter(m => m.nome !== p.name).map(m => ({m, r:reciclagem(m.nome)})).filter(x => precisaRecicl(x.r));
    if (rr.length) { const crit = rr.filter(x => x.r.cls === 'crit'); P.push({ic:'report', t:`${rr.length} bombeiro${rr.length>1?'s':''} perto da reciclagem${lv<4?' na equipe':''}`, s: rr.sort((a,b)=>a.r.ord-b.r.ord||(a.r.dias??0)-(b.r.dias??0)).slice(0,3).map(x=>`${first(x.m.nome)} (${x.r.status==='vencida'?'vencida':x.r.status==='sem'?'sem registro':x.r.dias+' d'})`).join(' · ') + (rr.length>3?' …':''), act:'go', v:'plantao', sub:'recicl', crit: crit.length > 0}); } }

/* ---------- pessoas e TAF ---------- */
const tafCfg = () => rec('taf-indices') || TAF_DEFAULT;
function pessoa(nome){ return rec('pessoa-'+slug(nome)) || {id:'pessoa-'+slug(nome), kind:'pessoa', nome, sexo:'', nasc:'', matricula:'', admissao:'', certs:[]}; }
function idadeEm(nasc, t){ if (!nasc) return null; const b = new Date(nasc+'T12:00'), d = new Date(t||Date.now()); let a = d.getFullYear() - b.getFullYear(); if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--; return isFinite(a) ? a : null; }
const faixaIdx = idade => idade == null ? 0 : FAIXAS.findIndex(([,a,b]) => idade >= a && idade <= b);
function cargoDe(nome){ for (const t of TEAMS) { const m = membros(t).find(x=>x.nome===nome); if (m) return {cargo:m.cargo, team:t}; } return nome === GESTOR ? {cargo:'gs', team:null} : {cargo:null, team:null}; }
function nivelEx(cfg, sexo, fx, exId, v){
  const ex = TAF_EX.find(e=>e.id===exId), t = ((cfg.tab[sexo||'M']||{})[exId]||[])[fx]; if (!t || v == null || v === '' || isNaN(v)) return null;
  if (ex.melhor === 'maior') return v >= t[2] ? 3 : v >= t[1] ? 2 : v >= t[0] ? 1 : 0;
  return v <= t[2] ? 3 : v <= t[1] ? 2 : v <= t[0] ? 1 : 0;
}
function avaliar(taf, p){
  const cfg = tafCfg(), idade = idadeEm(p.nasc, taf.ts), fx = Math.max(0, faixaIdx(idade)), sexo = p.sexo || 'M';
  const niveis = {}; let soma = 0, n = 0, apto = true;
  const PTS = [0,6,8,10];
  TAF_EX.forEach(ex => { const v = (taf.valores||{})[ex.id]; const nv = nivelEx(cfg, sexo, fx, ex.id, v); niveis[ex.id] = nv; if (nv != null) { soma += PTS[nv]; n++; if (nv === 0) apto = false; } });
  const completo = n === TAF_EX.length, media = n ? soma/n : 0;
  return {niveis, idade, fx, sexo, apto: apto && completo, completo, nota: n ? Math.round(media*10)/10 : null, conceito: !n ? '—' : !apto ? 'Inapto' : media >= 9 ? 'Excelente' : media >= 7 ? 'Bom' : 'Regular', dadosOk: !!(p.sexo && p.nasc)};
}
const fmtVal = (exId, v) => v == null || v === '' ? '—' : TAF_EX.find(e=>e.id===exId).unid === 'tempo' ? fmtSeg(v) : String(v);
const fmtNota = n => n == null ? '—' : n.toFixed(1).replace('.',',');
function tafsDe(nome){ return all('taf').filter(t => t.nome === nome).sort((a,b) => a.ts - b.ts); }
function ultimoOficial(nome){ return tafsDe(nome).filter(t => t.tipo === 'oficial').pop() || null; }

  const u = ultimoOficial(nome), cfg = tafCfg();
  if (!u) return {u:null, status:'sem', label:'Sem TAF', cls:'crit'};
  const venc = addMonths(u.ts, cfg.validadeMeses || 6), dias = daysTo(venc), av = avaliar(u, pessoa(nome));
  if (dias < 0) return {u, av, venc, status:'vencido', label:'Vencido', cls:'crit'};
  if (!av.apto) return {u, av, venc, status:'inapto', label: av.completo ? 'Inapto' : 'Incompleto', cls:'crit'};
  return {u, av, venc, status: dias <= 30 ? 'vencendo' : 'apto', label: dias <= 30 ? `Apto · vence em ${dias} d` : 'Apto', cls: dias <= 30 ? 'warn' : 'ok'};
}
function podeVer(nome){ const lv = LVL[S.role]||0; if (nome === me().name || lv >= 4) return true; if (lv === 3) { const c = cargoDe(nome); return c.team && c.team === me().team; } return false; }
function podeAvaliar(nome){ const lv = LVL[S.role]||0, c = cargoDe(nome); if (lv >= 4) return true; return lv === 3 && c.team === me().team && nome !== me().name; }

function exChart(ex, regs, thr){
  if (!regs.length) return '<p class="small muted">Sem registros.</p>';
  const W = 320, Hh = 150, L = 40, Rr = 14, T = 18, B = 24, iw = W-L-Rr, ih = Hh-T-B, menor = ex.melhor === 'menor';
  const vals = regs.map(r=>r.v).concat(thr ? [thr] : []);
  let lo = menor ? Math.min(...vals)*0.94 : 0, hi = Math.max(...vals)*(menor ? 1.04 : 1.18);
  if (hi - lo < 1) hi = lo + 1;
  const y = v => menor ? T + (v-lo)/(hi-lo)*ih : T + ih - (v-lo)/(hi-lo)*ih;
  const x = k => regs.length === 1 ? L + iw/2 : L + k*iw/(regs.length-1);
  let g = '';
  const ticks = 3; for (let k = 0; k <= ticks; k++) { const v = lo + (hi-lo)*k/ticks; g += `<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${menor ? fmtSeg(v) : Math.round(v)}</text>`; }
  if (thr) g += `<line class="meta" x1="${L}" x2="${W-Rr}" y1="${y(thr).toFixed(1)}" y2="${y(thr).toFixed(1)}"/>`;
  g += `<polyline class="ln" points="${regs.map((r,k)=>x(k).toFixed(1)+','+y(r.v).toFixed(1)).join(' ')}"/>`;
  regs.forEach((r,k) => { g += `<circle class="${r.tipo==='oficial'?'pt':'pt hollow'}" cx="${x(k).toFixed(1)}" cy="${y(r.v).toFixed(1)}" r="4"><title>${fDY(r.ts)} · ${fmtVal(ex.id, r.v)} · ${r.tipo==='oficial'?'TAF oficial':'treino'}</title></circle>`; });
  const last = regs[regs.length-1];
  g += `<text class="val" x="${Math.min(W-Rr, x(regs.length-1)).toFixed(1)}" y="${(y(last.v)-9).toFixed(1)}" text-anchor="end">${fmtVal(ex.id, last.v)}</text>`;
  g += `<text class="ax" x="${x(0).toFixed(1)}" y="${Hh-6}" text-anchor="${regs.length===1?'middle':'start'}">${fD(regs[0].ts)}/${String(new Date(regs[0].ts).getFullYear()).slice(2)}</text>`;
  if (regs.length > 1) g += `<text class="ax" x="${x(regs.length-1).toFixed(1)}" y="${Hh-6}" text-anchor="end">${fD(last.ts)}/${String(new Date(last.ts).getFullYear()).slice(2)}</text>`;
  return `<svg class="trc" viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Evolução em ${esc(ex.nome)}">${g}</svg>`;
}

/* ---------- férias ---------- */
const ST_FER = {solicitada:['Aguardando gestor','warn'], aprovada:['Aprovada','ok'], recusada:['Recusada','plain']};
const dts = s => new Date(s+'T00:00').getTime();
const diasFer = f => Math.round((dts(f.fim) - dts(f.inicio))/D) + 1;
const voltaFer = f => dts(f.fim) + D;
const dLabel = t => `${WD[new Date(t).getDay()]} ${fD(t)}`;
const feriasDe = nome => all('ferias').filter(f => f.nome === nome).sort((a,b) => dts(a.inicio) - dts(b.inicio));
function emFerias(nome, t){ return all('ferias').some(f => f.nome === nome && f.status === 'aprovada' && t >= dts(f.inicio) && t < voltaFer(f)); }
function conflitos(f){ const team = cargoDe(f.nome).team; if (!team) return []; return all('ferias').filter(o => o.id !== f.id && o.status === 'aprovada' && o.nome !== f.nome && cargoDe(o.nome).team === team && dts(o.inicio) <= dts(f.fim) && dts(f.inicio) <= dts(o.fim)); }
function regraFerias(f){
  const c = cargoDe(f.nome); if (!c.team) return {ok:true, motivo:'', outros:[]};
  const outros = conflitos(f), mesma = outros.filter(o => cargoDe(o.nome).cargo === c.cargo);
  let motivo = '';
  if (outros.length >= 2) motivo = `já há 2 da equipe ${c.team} de férias no período (${outros.map(o=>first(o.nome)).join(' e ')})`;
  else if (mesma.length) motivo = `${first(mesma[0].nome)} tem a mesma função (${CARGO[c.cargo]}) e está de férias no período`;
  return {ok: !motivo, motivo, outros};
}
const REGRA_FER = 'Regra da seção: até 2 bombeiros da mesma equipe de férias ao mesmo tempo, desde que de funções diferentes.';
function feriasResumo(nome){
  const hoje = Date.now(), ap = feriasDe(nome).filter(f => f.status === 'aprovada');
  const atual = ap.find(f => hoje >= dts(f.inicio) && hoje < voltaFer(f)); if (atual) return `De férias · volta ${dLabel(voltaFer(atual))}`;
  const prox = ap.find(f => dts(f.inicio) > hoje); return prox ? `${fD(dts(prox.inicio))} a ${fD(dts(prox.fim))} (${diasFer(prox)} dias)` : '—';
}
function ganttFerias(ps){
  const a = new Date(); a.setDate(1); a.setHours(0,0,0,0); a.setMonth(a.getMonth()-1); const ini = a.getTime(), fimW = addMonths(ini, 12), span = fimW - ini;
  const meses = Array.from({length:12}, (_,k) => addMonths(ini, k)), MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const pos = t => Math.max(0, Math.min(100, (t - ini)/span*100)), hoje = pos(Date.now());
  const rows = ps.map(m => { const fs = feriasDe(m.nome).filter(f => f.status !== 'recusada' && voltaFer(f) > ini && dts(f.inicio) < fimW);
    return `<div class="g-row"><div class="g-name">${esc(m.nome)}<span class="small muted"> · ${esc(m.team)}</span></div><div class="g-track">${meses.map((_,k)=>`<i class="g-m" style="left:${(k/12*100).toFixed(3)}%"></i>`).join('')}<i class="g-today" style="left:${hoje.toFixed(2)}%"></i>${fs.map(f => { const l = pos(dts(f.inicio)), r = pos(voltaFer(f)); return `<span class="g-bar ${f.status==='aprovada'?'ok':'pend'}" style="left:${l.toFixed(2)}%;width:${Math.max(0.6, r-l).toFixed(2)}%" title="${esc(m.nome)}: ${fDY(dts(f.inicio))} a ${fDY(dts(f.fim))} · ${ST_FER[f.status][0]}"></span>`; }).join('')}</div></div>`; }).join('');
  return `<div class="tbl-wrap"><div class="gantt"><div class="g-row g-head"><div class="g-name"></div><div class="g-track">${meses.map((t,k)=>`<span class="g-ml" style="left:${(k/12*100).toFixed(3)}%">${MES[new Date(t).getMonth()]}${new Date(t).getMonth()===0?' '+String(new Date(t).getFullYear()).slice(2):''}</span>`).join('')}</div></div>${rows}</div></div>`;
}
function vFerias(){
  const lv = LVL[S.role]||0, team = lv >= 4 ? (S.ferTeam || 'Todas') : (me().team || 'Todas');
  const ps = lv <= 2 ? [{nome: me().name, cargo: S.role, team: me().team}] : (team === 'Todas' ? TEAMS : [team]).flatMap(t => membros(t).map(m => ({...m, team:t})));
  const nomes = new Set(ps.map(p=>p.nome)), hoje = Date.now();
  const fs = all('ferias').filter(f => nomes.has(f.nome));
  const agora = fs.filter(f => f.status === 'aprovada' && hoje >= dts(f.inicio) && hoje < voltaFer(f)).sort((a,b)=>voltaFer(a)-voltaFer(b));
  const prox = fs.filter(f => f.status === 'aprovada' && dts(f.inicio) > hoje && dts(f.inicio) - hoje <= 60*D).sort((a,b)=>dts(a.inicio)-dts(b.inicio));
  const pend = fs.filter(f => f.status === 'solicitada' && (lv >= 4 || f.nome === me().name || (lv === 3 && cargoDe(f.nome).team === me().team))).sort((a,b)=>dts(a.inicio)-dts(b.inicio));

  let out = lv < 4 ? '' : `<div class="filters">${['Todas',...TEAMS].map(t=>`<button class="fbtn ${t===team?'on':''}" data-act="fer-team" data-v="${t}">${t}</button>`).join('')}</div>`;
  out += `<p class="note">${REGRA_FER}</p>`;
  if (pend.length) out += `<section class="panel"><div class="panel-h"><h2>Pedidos de férias</h2><span class="chip warn">${pend.length}</span></div><div class="list">${pend.map(f => linha(f, lv >= 4 ? `<div class="btnrow" style="margin-top:6px"><button class="btn sm okb" data-act="fer-ap" data-id="${f.id}">${ic('check')}${regraFerias(f).ok?'Aprovar':'Aprovar como exceção'}</button><button class="btn sm critb" data-act="fer-rec" data-id="${f.id}">Recusar</button></div>` : '')).join('')}</div></section>`;
  out += `<div class="grid2"><section class="panel"><div class="panel-h"><h2>De férias agora</h2><span class="tag">${agora.length}</span></div><div class="list">${agora.map(f=>linha(f)).join('') || '<div class="empty">Ninguém de férias hoje.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Próximas saídas</h2><span class="small muted">60 dias</span></div><div class="list">${prox.map(f=>linha(f)).join('') || '<div class="empty">Nenhuma saída nos próximos 60 dias.</div>'}</div></section></div>`;
  out += `<section class="panel"><div class="panel-h"><h2>Escala de férias</h2><span class="small muted legend"><i class="lg-ok"></i>aprovadas <i class="lg-pend"></i>aguardando <i class="lg-today"></i>hoje</span></div><div class="panel-b">${ganttFerias(ps)}</div></section>`;
  return out;
}

function reciclagem(nome){

function parseTrack(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('arquivo');
  const map = t => { t = String(t||'').toLowerCase(); return /run|^9$|corr/.test(t) ? 'Corrida' : /walk|hik|^10$|camin/.test(t) ? 'Caminhada' : /ride|bik|cycl|^1$/.test(t) ? 'Pedal' : /swim/.test(t) ? 'Natação' : 'Corrida'; };
  const laps = doc.getElementsByTagName('Lap');
  if (laps.length) { let dist = 0, sec = 0; [...laps].forEach(l => { const dm = l.getElementsByTagName('DistanceMeters')[0], tt = l.getElementsByTagName('TotalTimeSeconds')[0]; dist += dm ? parseFloat(dm.textContent) : 0; sec += tt ? parseFloat(tt.textContent) : 0; });
    const act = doc.getElementsByTagName('Activity')[0], id = doc.getElementsByTagName('Id')[0];
    return {tipo: map(act && act.getAttribute('Sport')), km: dist/1000, seg: sec, ts: id ? Date.parse(id.textContent) : Date.now(), titulo:''}; }
  const pts = [...doc.getElementsByTagName('trkpt')]; if (pts.length < 2) throw new Error('vazio');
  const R = 6371e3, rad = x => x*Math.PI/180; let dist = 0, subida = 0, prev = null;
  pts.forEach(p => { const la = parseFloat(p.getAttribute('lat')), lo = parseFloat(p.getAttribute('lon')), el = p.getElementsByTagName('ele')[0], e = el ? parseFloat(el.textContent) : null;
    if (prev) { const dφ = rad(la-prev.la), dλ = rad(lo-prev.lo), a = Math.sin(dφ/2)**2 + Math.cos(rad(prev.la))*Math.cos(rad(la))*Math.sin(dλ/2)**2; dist += 2*R*Math.asin(Math.sqrt(a)); if (e != null && prev.e != null && e > prev.e) subida += e - prev.e; }
    prev = {la, lo, e}; });
  const tm = pts.map(p => { const t = p.getElementsByTagName('time')[0]; return t ? Date.parse(t.textContent) : NaN; }).filter(isFinite);
  const nm = doc.getElementsByTagName('name')[0], ty = doc.getElementsByTagName('type')[0];
  return {tipo: map(ty && ty.textContent), km: dist/1000, seg: tm.length > 1 ? (tm[tm.length-1]-tm[0])/1000 : 0, ts: tm[0] || Date.now(), titulo: nm ? nm.textContent.trim() : '', elev: Math.round(subida)};
}

function lastCheck(v){ return all('check').filter(c=>c.vtr===v).sort(byTs)[0]; }

function openSheet(title, body, wide){

  document.body.style.overflow = 'hidden';
  const f = sr.querySelector('input:not([type=hidden]):not([type=file]),textarea,select'); if (f && window.innerWidth > 700) setTimeout(()=>f.focus(), 50);
}
function closeSheet(){ document.getElementById('sheetroot').innerHTML = ''; document.body.style.overflow = ''; S.sheet = null; }
let toastT;
function toast(msg){ const t = document.getElementById('toastroot'); if (!t) return; t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>{ t.innerHTML=''; }, 3200); }

function compress(file){ return new Promise((res,rej)=>{ const u = URL.createObjectURL(file), img = new Image(); img.onload = () => { const s = Math.min(1, 900/Math.max(img.width,img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.7)); }; img.onerror = () => { URL.revokeObjectURL(u); rej(); }; img.src = u; }); }

function eqPend(){

  return {faltas, avariados};
}

    pedidos_em_andamento: all('sol').filter(s=>s.status==='pendente'||s.status==='aprovada').map(s=>({num:s.num, item:s.item, qtd:s.qtd, prioridade:s.prio, situacao:ST_SOL[s.status][0]})),

    estoque_abaixo_do_minimo: all('est').filter(e=>e.qtd<e.min).map(e=>`${e.nome}: ${e.qtd}/${e.min}`),
    observacoes_recentes: all('obs').filter(o=>o.ts>=since).sort(byTs).slice(0,8).map(o=>o.txt),
  };
  const prompt = `Você escreve para o gerente do Aeroporto de Vitória da Conquista (SBVC) um resumo da Seção Contra Incêndio (bombeiros de aeródromo) dos últimos 7 dias. O gerente quase não vai até a seção e quer entender a situação em 30 segundos.

Regras: português do Brasil, frases curtas e diretas, sem jargão desnecessário, sem inventar nada que não esteja nos dados. Formato em texto puro, sem markdown:
- Uma linha de abertura com a situação geral (prontidão das viaturas).
- De 4 a 6 linhas começando com "• " com os fatos que importam.
- Uma última linha começando com "Precisa de decisão:" com o que depende da gerência (pedidos aprovados aguardando, manutenções paradas, itens críticos como EPR). Se nada depender dele, diga isso.

Dados (JSON):
${JSON.stringify(data)}`;

async function copy(txt, msg){ try { await navigator.clipboard.writeText(txt); toast(msg); } catch(e){ openSheet('Copiar', `<div class="form"><p class="small muted">Selecione o texto abaixo e copie.</p><textarea id="cp-area" style="min-height:300px;width:100%" class="mono">${esc(txt)}</textarea></div>`); const a = document.getElementById('cp-area'); a.focus(); a.select(); } }
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (!fn) return; if (el.dataset.act === 'd-sol' && e.target.closest('button')) return; fn(el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lg-novo') { ACT['lg-novo'](); return; } if (e.key === 'Escape' && document.querySelector('.scrim')) closeSheet(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row.click,.strip,tr.click,.rb-card')) { e.preventDefault(); e.target.click(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (!S.role || h === S.view) return; if (h === 'rede' && S.role !== 'rede') return; if (SECOES[h] || (h === 'perfil' && S.perfilNome)) { S.view = h; render(); } });

/* ================= início ================= */
(function init(){
  try { const pf = JSON.parse(lsGet('pront-prof')||'null'); if (pf && LVL[pf.role] && pf.name) { S.prof = pf; S.role = pf.role; } } catch(e){}
  const h = location.hash.slice(1); if (SECOES[h] && (h !== 'rede' || S.role === 'rede')) S.view = h; else if (S.role === 'rede') S.view = 'rede';
  render();
})();
</script>
